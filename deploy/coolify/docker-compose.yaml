# Folio for Coolify: paste into "Docker Compose Empty" (see README.md).
# Image: ghcr.io/evergreen-it-dev/folio, built for amd64 and arm64.
#
# Coolify fills in the SERVICE_* variables below:
#   SERVICE_URL_FOLIO_4870        the address of the app (with https://) and the
#                                 port the proxy sends traffic to
#   SERVICE_PASSWORD_POSTGRES     32 random characters, shared with the database
#   SERVICE_PASSWORD_64_FOLIOSECRET  64 random characters, kept across redeploys
# Everything else is optional; empty variables show up in Coolify's
# Environment Variables tab, ready to fill in.
services:
  folio:
    image: 'ghcr.io/evergreen-it-dev/folio:${FOLIO_TAG:-latest}'
    environment:
      - SERVICE_URL_FOLIO_4870
      - NODE_ENV=production
      - PORT=4870
      - 'PUBLIC_URL=${SERVICE_URL_FOLIO}'
      - 'DATABASE_URL=postgresql://folio:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/folio'
      - 'REDIS_URL=redis://redis:6379'
      - ASSET_BACKEND=local
      # Encrypts saved git tokens and personal AI keys. Generated once by
      # Coolify. Never change it: credentials saved earlier would stop working.
      - 'FOLIO_SECRET=${SERVICE_PASSWORD_64_FOLIOSECRET}'
      # "Sign in with Google" (optional). Redirect URI to register with Google:
      # <your address>/api/auth/google/callback
      - 'GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}'
      - 'GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}'
      - 'GOOGLE_ALLOWED_DOMAINS=${GOOGLE_ALLOWED_DOMAINS}'
      # AI assistant (optional). People normally add their own key in their
      # account settings; this is a shared fallback.
      - 'CURSOR_API_KEY=${CURSOR_API_KEY}'
      - 'CURSOR_AGENT_MODEL=${CURSOR_AGENT_MODEL:-auto}'
      - CURSOR_AGENT_WORKSPACE_ROOT=/app/data/assistant/workspaces
      - CURSOR_AGENT_STATE_DIR=/app/data/assistant/state
    volumes:
      # The content itself: git repositories of the spaces, uploaded files.
      - 'folio-data:/app/data'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "fetch('http://127.0.0.1:4870/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  postgres:
    image: 'postgres:17-alpine'
    environment:
      - POSTGRES_USER=folio
      - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}'
      - POSTGRES_DB=folio
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'
      interval: 5s
      timeout: 5s
      retries: 20

  # Transient data only (presence, rate limits): persistence is off on purpose.
  redis:
    image: 'redis:7-alpine'
    command: "redis-server --save '' --appendonly no"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - PING
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  folio-data:
  postgres-data:
